<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
    <link rel="stylesheet" th:href="@{/index/style.css}">
</head>
<body>
<nav class="navbar">
    <img th:src="@{/images/logo-evntra2-0.png}" class="site-logo" alt="Logo of the Website.">
    <h1 class="main-header">
        <a th:href="@{/}">Eventa-2.0</a>
    </h1>
    <ol class="link-list">
        <li><a href="#">Events</a></li>
        <li><a href="#">Event History</a></li>
        <li><a href="#">Veranstalter</a></li>
        <li><a href="#">Workshops</a></li>
        <li><a href="#">Kontakt</a></li>
    </ol>
    <button class="login-btn" type="submit">Login</button>
</nav>
<div class="main-image">
    <img th:src="@{/images/main-image.png}" class="main-image-photo" alt="Main image of the webpage.">
    <div class="hero-content">
        <h2 class="on-image-header">
            Discover<br>
            Learn<br>
            Experience
        </h2>
        <div class="search-container">
        <form th:action="@{/events/search}" th:object="${searchForm}" method="POST" class="search-form">
            <div class="search-field search-field-keyword">
                <svg class="search-icon"
                     xmlns="http://www.w3.org/2000/svg"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     stroke-linecap="round"
                     stroke-linejoin="round"
                     aria-hidden="true">
                    <circle cx="11" cy="11" r="7"></circle>
                    <path d="m20 20-4-4"></path>
                </svg>
                <input type="text" th:field="*{search}" placeholder="Wonach suchen Sie?" autocomplete="off">
            </div>
            <div class="search-field search-field-location">
                <svg class="location-icon"
                     xmlns="http://www.w3.org/2000/svg"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     stroke-linecap="round"
                     stroke-linejoin="round"
                     aria-hidden="true">
                    <path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"></path>
                    <circle cx="12" cy="10" r="2.5"></circle>
                </svg>
                <input type="text" th:field="*{location}" placeholder="Ihr Standort" autocomplete="off">
            </div>
            <button type="submit" class="search-button">
                Search
            </button>
        </form>
        </div>
    </div>
</div>
<div class="current-event-list">
    <h3 class="evnt-list-header">Folgende Events stehen an</h3>
    <div class="section-divider" aria-hidden="true"></div>
    <div class="event" th:each="event : ${eventList}">
        <h4 class="event-name" th:text="${event.eventName}">
            Event Name
        </h4>
        <p class="event-description" th:text="${event.eventDescription}">
            Event Beschreibung
        </p>
        <p class="event-date" th:text="${event.eventDate}">
            Event Datum
        </p>
        <p class="event-location" th:text="${event.location}">
            Event Ort
        </p>
    </div>
</div>
<footer class="footer">
    <a href="#">Impressum</a>
    <a href="#">Datenschutz</a>
    <a href="#">Kontakt</a>
</footer>
</body>
</html>
