<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
    <link rel="stylesheet" th:href="@{/events/style.css}">
</head>
<body>
<nav class="navbar">
    <img th:src="@{/images/logo-evntra2-0.png}" class="site-logo" alt="Logo of the Website.">
    <h1 class="main-header">
        <a th:href="@{/}">Eventa-2.0</a>
    </h1>
    <ol class="link-list">
        <li><a th:href="@{/events}">Events</a></li>
        <li><a th:href="@{/organizer}">Veranstalter</a></li>
        <li><a href="#">Workshops</a></li>
        <li><a th:href="@{/contactus}">Kontakt</a></li>
    </ol>
    <button class="login-btn" type="submit">
        <a th:href="@{/login}">Login</a>
    </button>
</nav>
<main class="current-event-list">
    <h3 class="evnt-list-header">Folgende Events stehen an</h3>
    <div class="section-divider" aria-hidden="true"></div>
    <div class="event" th:each="event : ${eventList}">
        <div class="event-card-content">
            <div class="event-card-heading">
                <span class="event-label">Event</span>
                <h4 class="event-name" th:text="${event.eventName}">
                    Event Name
                </h4>
            </div>
            <p class="event-description" th:text="${event.eventDescription}">
                Event Beschreibung
            </p>
            <div class="event-details">
                <p class="event-detail event-date">
                    <svg class="event-detail-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                         aria-hidden="true">
                        <rect x="3" y="4" width="18" height="17" rx="2"></rect>
                        <path d="M16 2v4M8 2v4M3 10h18"></path>
                        <path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"></path>
                    </svg>
                    <span th:text="${event.eventDate}">Event Datum</span>
                </p>
                <p class="event-detail event-location">
                    <svg class="event-detail-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                         aria-hidden="true">
                        <path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"></path>
                        <circle cx="12" cy="10" r="2.5"></circle>
                    </svg>
                    <span th:text="${event.location}">Event Ort</span>
                </p>
            </div>
        </div>
        <div class="event-card-arrow" aria-hidden="true">→</div>
    </div>
</main>
</body>
</html>
